name: Feature request
description: Suggest a new tool, a new capability or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/IvanBBaev/servicenow-mcp-ai#readme) and the
        [roadmap](https://github.com/IvanBBaev/servicenow-mcp-ai/blob/main/project/ROADMAP-V3.md)
        first — the feature may already exist or be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The tool, parameter, setting or behaviour you have in mind. Name the ServiceNow REST API or table involved if you know it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today or other approaches you weighed.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP server tools
        - CLI (init, doctor, login, drift, support-bundle)
        - VS Code extension
        - Claude Code plugin skills
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: writes
    attributes:
      label: Does it write to the instance?
      description: Write tools go through plan mode, the write journal and the policy axes, so they need more design.
      options:
        - No — read-only
        - Yes — creates, updates or deletes records
        - Not sure
    validations:
      required: true
