name: Live smoke

# E-6 / O-2: read-only smoke of the PDI scenarios (test/fixtures/pdi/pdi.js)
# against a real instance. Credentials come from the SN_INSTANCE / SN_USER /
# SN_PASSWORD repository secrets. N-107: an unset secret fails the run, because
# a skipped smoke that reports success is worse than none. A hibernating PDI is
# reported as asleep by scripts/live-wake.mjs, apart from a shape regression.
# Never part of `npm run check` — PDIs hibernate, so a red run here is a
# signal to look, not a release gate.
on:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USER: ${{ secrets.SN_USER }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
    steps:
      - name: Require the secrets
        run: |
          for key in SN_INSTANCE SN_USER SN_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::$key secret is not set; the live smoke cannot run."
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wake the instance
        run: node scripts/live-wake.mjs
      - run: npm run test:live
