name: Publish

# Publish to npm from CI on a version tag (never from a laptop). The same
# `npm run check` gate runs here, and `prepublishOnly` runs it again as a
# backstop, so a red build cannot reach the registry. After a successful
# publish, D-6: a GitHub Release for the tag whose notes are that version's
# CHANGELOG section (scripts/release-notes.mjs). N-51: the mcpb-asset job
# attaches the MCP bundle (.mcpb) to that release — the repository variable
# MCPB_RELEASE ("true" since 3.0.0, O-22) is its switch; unset it and the job
# is skipped. O-14 (ADR 0011): a prerelease version
# (`3.0.0-beta.1`, anything with a `-`) goes to the npm `next` dist-tag and
# its GitHub Release is marked as a prerelease, so `latest` and the release
# list only ever point at a GA version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || { echo "tag v$tag != package.json $pkg"; exit 1; }
      - run: npm run check
      - name: Choose the npm dist-tag (a prerelease goes to next)
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release for the tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Release notes from the CHANGELOG section
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # $pre stays unquoted: a GA tag passes no flag.
          case "${GITHUB_REF_NAME#v}" in
            *-*) pre=--prerelease ;;
            *) pre="" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md $pre
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag $pre \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi

  # N-51 / TK-27: the MCP bundle as a release asset. Dormant until O-22 —
  # Settings → Secrets and variables → Actions → Variables → MCPB_RELEASE=true.
  mcpb-asset:
    needs: github-release
    if: ${{ vars.MCPB_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the asset to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack the MCP bundle
        run: npm run mcpb:pack -- --validate
      - name: Attach the bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/mcpb/*.mcpb --clobber
