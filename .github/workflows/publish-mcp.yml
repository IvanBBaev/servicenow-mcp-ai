name: Publish to MCP Registry

# Register the server in the official MCP Registry (registry.modelcontextprotocol.io)
# from server.json. Runs after the npm "Publish" workflow succeeds (so the registry
# can verify the published tarball's mcpName), and can be re-run on demand via
# workflow_dispatch without re-publishing to npm. server.json carries the version
# (kept in sync with package.json), so this always registers the current release.
# N-91: when the Publish workflow attached the release's MCP bundle (.mcpb), it
# is added to server.json as an `mcpb` package with its sha256
# (scripts/registry-mcpb.mjs) right before publishing, so the registry lists the
# one-click install next to the npm package; the committed server.json carries
# the npm package alone because the hash is only known once CI built the bundle.
# O-14 (ADR 0011): a prerelease tag (`v3.0.0-beta.1`) is not registered; the
# registry entry moves only on a GA version.
on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC for mcp-publisher (no extra secret needed)

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-')) }}
    env:
      # H-9: a pinned mcp-publisher release instead of `releases/latest`, verified
      # against the checksums file of the same release, so a moved or tampered
      # asset cannot run with the OIDC token. Bump deliberately:
      # https://github.com/modelcontextprotocol/registry/releases
      MCP_PUBLISHER_VERSION: 1.8.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # N-95: the released commit, not the default branch head (empty on dispatch).
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Add the release bundle (.mcpb) to server.json (N-91)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./server.json').version")
          mkdir -p dist/mcpb
          if gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern '*.mcpb' --dir dist/mcpb; then
            node scripts/registry-mcpb.mjs dist/mcpb/*.mcpb
          else
            echo "::notice::v$version carries no .mcpb asset; registering the npm package only"
          fi
      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          checksums="registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "$base/$asset"
          curl -fsSLO "$base/$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar xzf "$asset" mcp-publisher
      - name: Publish to the MCP Registry (GitHub OIDC)
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
