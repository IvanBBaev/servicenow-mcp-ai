name: Publish VS Code Extension

# Publish the VS Code extension (extension/) to the Visual Studio Marketplace
# and (D-6) to Open VSX, so Cursor / Windsurf / VSCodium users can install it.
# Runs on a version tag (alongside the npm "Publish" workflow) and on demand via
# workflow_dispatch (for the first publish or a re-run). The .vsix is packaged
# once and the same file goes to both registries. Authentication uses the
# VSCE_PAT repo secret (Azure DevOps PAT, scope Marketplace > Manage) and the
# OVSX_PAT repo secret (an open-vsx.org access token; the Open VSX step is
# skipped while it is not set); the tokens never touch a laptop or the logs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a new ovsx release cannot run with the token unreviewed.
  OVSX_VERSION: 0.10.6

jobs:
  publish-vscode:
    runs-on: ubuntu-latest
    env:
      # Read into the environment so a step can be skipped when it is unset
      # (secrets cannot be tested in an `if:` directly).
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # GA-3: the extension version must match the root package version, so the
      # Marketplace can never lag behind an npm release (2.0.0 vs 2.0.1 happened).
      - name: Check version sync with the root package
        run: |
          root=$(node -p "require('../package.json').version")
          ext=$(node -p "require('./package.json').version")
          if [ "$root" != "$ext" ]; then
            echo "Version skew: root $root vs extension $ext" >&2
            exit 1
          fi
      - run: npm run compile
      - name: Package the extension
        run: npx vsce package --no-dependencies -o servicenow-mcp-ai.vsix
      - name: Publish to the Marketplace
        run: npx vsce publish --no-dependencies --packagePath servicenow-mcp-ai.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes "ovsx@${OVSX_VERSION}" publish servicenow-mcp-ai.vsix -p "$OVSX_PAT"
