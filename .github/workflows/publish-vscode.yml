name: Publish VS Code Extension

# Publish the VS Code extension (extension/) to the Visual Studio Marketplace
# and (D-6) to Open VSX, so Cursor / Windsurf / VSCodium users can install it.
# Runs after the npm "Publish" workflow succeeds (N-95: a tag whose gate or npm
# publish failed no longer ships the extension) and on demand via
# workflow_dispatch (for a re-run). It checks out the commit the tag points at.
# The .vsix is packaged once and the same file goes to both registries. Authentication uses the
# VSCE_PAT repo secret (Azure DevOps PAT, scope Marketplace > Manage) and the
# OVSX_PAT repo secret (an open-vsx.org access token; the Open VSX step is
# skipped while it is not set); the tokens never touch a laptop or the logs.
# O-14 (ADR 0011): a prerelease tag (`v3.0.0-beta.1`) does not publish the
# extension — the Marketplace takes no semver prerelease versions, and the
# extension moves only on a GA version. workflow_dispatch still runs.
on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vscode
  cancel-in-progress: false

env:
  # Pinned so a new ovsx release cannot run with the token unreviewed.
  OVSX_VERSION: 0.10.6

jobs:
  publish-vscode:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-')) }}
    runs-on: ubuntu-latest
    environment: release
    env:
      # Read into the environment so a step can be skipped when it is unset
      # (secrets cannot be tested in an `if:` directly).
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released commit, not the default branch head (empty on dispatch).
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # GA-3: the extension version must match the root package version, so the
      # Marketplace can never lag behind an npm release (2.0.0 vs 2.0.1 happened).
      - name: Check version sync with the root package
        run: |
          root=$(node -p "require('../package.json').version")
          ext=$(node -p "require('./package.json').version")
          if [ "$root" != "$ext" ]; then
            echo "Version skew: root $root vs extension $ext" >&2
            exit 1
          fi
      - run: npm run compile
      - name: Package the extension
        run: npx vsce package --no-dependencies -o servicenow-mcp-ai.vsix
      - name: Publish to the Marketplace
        # --skip-duplicate: a re-run (e.g. to reach Open VSX) must not fail on a
        # version the Marketplace already has.
        run: npx vsce publish --no-dependencies --skip-duplicate --packagePath servicenow-mcp-ai.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes "ovsx@${OVSX_VERSION}" publish servicenow-mcp-ai.vsix --skip-duplicate -p "$OVSX_PAT"
